# ==============================================================================
# MONITORING VALUES - LIGHTWEIGHT
# ==============================================================================

# 1. Desativar o Alertmanager (economiza ~3 pods e muita memória)
alertmanager:
  enabled: false

# 2. Prometheus (Servidor de Métricas)
prometheus:
  prometheusSpec:
    retention: 24h
    
    # Recursos bem calculados para não estourar a máquina
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

    # Persistência: volume EBS leve de 2Gi (gp2)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# 3. Grafana (Painéis e Dashboards visuais)
grafana:
  enabled: true
  adminPassword: "admin" # Troque para a sua senha desejada
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi

  # Persistência para salvar seus dashboards personalizados
  persistence:
    enabled: true
    storageClassName: gp2
    size: 2Gi

# 4. Exportadores de métricas essenciais do cluster (muito leves)
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# 5. Desativar regras e componentes avançados desnecessários no início
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi