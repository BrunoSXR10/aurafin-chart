apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aurafin-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BrunoSXR10/aurafin-chart.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
      exclude: 'root-app.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

